name: Release

on:
  pull_request:
    paths:
      - 'package.json'
      - '.github/workflows/release.yaml'
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    if: github.event_name == 'pull_request' || github.event.created
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Check version and release tag
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ $GITHUB_EVENT_NAME == push ]]; then
            if [[ $GITHUB_REF_NAME != "v$version" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match package.json (v$version)"
              exit 1
            fi
            git merge-base --is-ancestor HEAD origin/main
          fi
          channel=latest
          if [[ $version == *-* ]]; then
            prerelease=${version#*-}
            channel=${prerelease%%.*}
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - run: yarn test --runInBand --verbose=false -t 'round-trips a negative signed integer'
      - name: Pack and verify npm payload
        env:
          CHANNEL: ${{ steps.version.outputs.channel }}
        run: |
          tarball=$(npm pack --silent)
          mv "$tarball" "$RUNNER_TEMP/package.tgz"
          npm publish "$RUNNER_TEMP/package.tgz" --access public --tag "$CHANNEL" --dry-run
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: npm-package
          path: ${{ runner.temp }}/package.tgz
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.event.created
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install --global npm@11.21.0
      - run: npm publish ./package.tgz --access public --tag "$CHANNEL"
        env:
          CHANNEL: ${{ needs.package.outputs.channel }}

  finish:
    needs: [package, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        if: needs.package.outputs.channel != 'latest'
        with:
          node-version: 24
      - name: Advance latest if it already tracks this prerelease line
        if: needs.package.outputs.channel != 'latest'
        run: |
          npm install --global npm@11.21.0
          package=@ton-community/tlb-runtime
          version=${GITHUB_REF_NAME#v}
          latest=$(npm view "$package" dist-tags.latest)
          if [[ ${latest%.*} == "${version%.*}" && $latest != "$version" ]] &&
             printf '%s\n' "$latest" "$version" | sort -VC; then
            npm dist-tag add "$package@$version" latest
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.package.outputs.channel }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes)
          if [[ $CHANNEL != latest ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${args[@]}"
